# Gruvbox Dark — alacritty's 16-colour ramp.
#
# Must stay in step with foot/.config/foot/colors-gruvbox.ini, including its
# one deliberate deviation: normal.black is bg1 (3c3836) rather than the
# canonical 282828, which would make "black" text invisible against the
# background.

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.selection]
text       = "#282828"
background = "#504945"

[colors.normal]
black   = "#3c3836"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
