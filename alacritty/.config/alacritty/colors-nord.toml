# Nord — alacritty's 16-colour ramp.
#
# Inlined rather than imported from ~/.config/alacritty/themes (the untracked
# alacritty-theme clone), so this package is self-contained: a fresh machine
# needs no clone for the colours to be right. Must stay in step with
# foot/.config/foot/colors-nord.ini.

[colors.primary]
background = "#2e3440"
foreground = "#d8dee9"

[colors.selection]
text       = "#2e3440"
background = "#4c566a"

[colors.normal]
black   = "#3b4252"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#81a1c1"
magenta = "#b48ead"
cyan    = "#88c0d0"
white   = "#e5e9f0"

[colors.bright]
black   = "#4c566a"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#81a1c1"
magenta = "#b48ead"
cyan    = "#8fbcbb"
white   = "#eceff4"
