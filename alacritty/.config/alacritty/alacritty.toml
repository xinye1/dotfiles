[general]
import = [
    # ~/.local/bin/theme renders it. Both live in this package, so alacritty no
    # longer depends on the untracked ~/.config/alacritty/themes clone for its
    # palette — the clone is only needed if you want other schemes to hand.
    "~/.config/alacritty/colors.gen.toml"
]

[font.offset]
x = 0
y = 0

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono"
style = "Regular"

[window]
decorations = "None"

[window.padding]
x = 8
y = 8

