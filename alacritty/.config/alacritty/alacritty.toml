[general]
import = [
    # Nord, not nordic.toml — despite the name they are different palettes, and
    # Nord is what the rest of the desktop uses. Must stay in step with the
    # inlined [colors-dark] block in foot/.config/foot/foot.ini.
    "~/.config/alacritty/themes/themes/nord.toml"
]

[font.offset]
x = 0
y = 0

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono"
style = "Regular"

[window]
decorations = "None"

[window.padding]
x = 8
y = 8

