#
# ~/.config/kitty/kitty.conf — managed by ~/repos/dotfiles (stow package: kitty)
#
# A port of the foot package, so the two terminals look and behave the same.
# kitty is the terminal sway launches: ~/.config/sway/config.d/default sets
# `$term kitty`, one process per window. `--single-instance` — the direct
# analogue of the `foot --server` this replaced — was measured and rejected
# there; the numbers and the reasoning live next to the setting.
#
# foot stays installed and themed as a standalone fallback. kitty is the
# default because foot is Wayland-only and kitty is not, so this config is the
# one that survives on an X11 or non-Linux machine.

# ~/.local/bin/theme flips it. Path is relative to this file.
#
# Unlike foot, kitty DOES reload: SIGUSR1 makes every running instance re-read
# this file and the include below, so a palette switch reaches open windows
# without closing them or disturbing what is running inside. `theme` sends it
# for you, at the end of every switch.
#
# To send it by hand, use kitty's own reloader rather than pkill:
#
#     kitty +runpy 'from kitty.utils import reload_conf_in_all_kitties as r; r()'
#
# `pkill -USR1 -x kitty` looks equivalent and is a trap. `kitty @ ...` and
# `kitty +...` helper processes share the basename and install no SIGUSR1
# handler, so pkill matches them and the default action for SIGUSR1 —
# terminate — kills them. kitty's function filters to GUI processes first.
include colors.gen.conf

# fontconfig family name, not the file name — the same resolution foot needs.
# alacritty's family = "JetBrainsMono" resolves via fc-match to the family
# "JetBrains Mono", which is what both foot and kitty want. Size is explicit
# because kitty's default is 11.0 only by coincidence; foot's is 8.
font_family      JetBrains Mono
font_size        11.0

# alacritty's [window.padding] x=8 y=8, foot's pad=8x8. kitty takes one number
# for all four sides, which is the same thing here.
window_padding_width 8

# foot's [csd] preferred=none, alacritty's decorations = "None". Under sway a
# tiled window has no titlebar either way; this is for the floating case.
hide_window_decorations yes

# TERM=xterm-kitty is correct locally, but a remote host without kitty's
# terminfo falls over — the same failure foot's TERM=foot has. kitty ships a
# fix foot has no equivalent of: `kitten ssh <host>` copies its terminfo to the
# remote host on connect. Prefer that to downgrading. To downgrade anyway:
# term xterm-256color

# --- putting kitty's defaults back to foot's --------------------------------
# Three places where kitty is chattier than foot. None is about colour, so none
# belongs in the template.

# foot closes when you close it. kitty asks for confirmation when a window
# still has a program running, which under sway is every close that is not a
# clean `exit`.
confirm_os_window_close 0

# foot's bell does nothing by default; kitty's beeps.
enable_audio_bell no

# foot's cursor does not blink. kitty's follows the system default, which does.
cursor_blink_interval 0
