# Gruvbox Dark — fuzzel's colours. Alpha is significant here: the launcher is
# translucent (background ...ee), everything else fully opaque (...ff).
#
# Included by fuzzel.ini via a `colors.ini` symlink that ~/.local/bin/theme
# flips. fuzzel reads its config at launch, so a switch applies to the next
# invocation with no reload needed.

[colors]
background=282828ee
text=ebdbb2ff
placeholder=7c6f64ff
prompt=fabd2fff
input=fbf1c7ff
match=fe8019ff
selection-match=fe8019ff
selection=504945ff
selection-text=fbf1c7ff
counter=7c6f64ff
border=fabd2fff
