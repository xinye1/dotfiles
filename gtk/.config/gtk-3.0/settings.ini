# The GTK look, one static file. scripts/import-gsettings pushes these values
# into gsettings on every reload, which is where Wayland GTK3 apps read them.
#
# Plain Adwaita in its dark variant, the same choice Omarchy makes: GTK apps are
# neutral grey rather than tinted to the palette, and in exchange nothing here
# changes on a palette switch, so this file is tracked as-is rather than
# rendered. `Adwaita` is compiled into GTK itself — there is no theme package
# to install, and no `Adwaita-dark` directory either: the dark half comes from
# gtk-application-prefer-dark-theme below (GTK3) and from the `color-scheme`
# key import-gsettings derives from it (GTK4/libadwaita). PLAYBOOK §2.2.
#
# The non-colour half is duplicated into gtk-4.0/settings.ini — the part GTK4
# still reads: gtk-theme-name, gtk-icon-theme-name, gtk-font-name,
# gtk-cursor-theme-name, gtk-cursor-theme-size and
# gtk-application-prefer-dark-theme, byte-identical there. The toolbar,
# button/menu-image, event-sound and Xft keys below are GTK3-only, have no GTK4
# counterpart, and are deliberately absent from it. Change a shared key here
# and change it there too; nothing checks the two agree.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-cursor-theme-name=Qogir-Dark
gtk-cursor-theme-size=24
gtk-toolbar-style=GTK_TOOLBAR_BOTH_HORIZ
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-application-prefer-dark-theme=1
