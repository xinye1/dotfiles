# xsettingsd config, Nord. Switched by ~/.local/bin/theme; xsettingsd.conf is
# a symlink to this or to xsettingsd-gruvbox.conf.
#
# xsettingsd serves XSettings to XWayland clients (PLAYBOOK.md §2.2) — native
# Wayland clients get their settings from gsettings instead (see
# sway/.config/sway/scripts/import-gsettings).
#
# NOTE: xsettingsd is not currently running, so nothing is consuming this file
# today. It is tracked and kept correct so that starting the daemon works
# immediately; actually starting it is out of scope for this task.
Net/ThemeName "Nordic"
Net/IconThemeName "Papirus-Dark"
Gtk/CursorThemeName "Qogir-dark"
Net/EnableEventSounds 1
EnableInputFeedbackSounds 0
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
