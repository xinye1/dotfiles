#
# ~/.config/foot/foot.ini — managed by ~/repos/dotfiles (stow package: foot)
#
# Ported from the alacritty package to keep both terminals looking identical.
# foot is the terminal sway actually launches: ~/.config/sway/config.d/default
# sets `$term footclient`, and autostart_applications execs `foot --server`, so
# mod+Return talks to that daemon. alacritty stays installed as the fallback for
# non-Wayland machines — foot is Wayland-only (Linux/FreeBSD).

# Palette. `colors.ini` is a symlink to colors-nord.ini or colors-gruvbox.ini;
# ~/.local/bin/theme flips it.
#
# foot has NO config-reload signal — SIGUSR1/SIGUSR2 only switch between the
# [colors-dark] and [colors-light] blocks that were loaded at startup. So a
# theme switch reaches foot only after `foot --server` restarts, which closes
# every open terminal. `theme --restart-terminals` does that on request.
include=~/.config/foot/colors.ini

[main]
# fontconfig family name, *not* the file name: alacritty's family = "JetBrainsMono"
# resolves via fc-match to the family "JetBrains Mono", which is what foot wants.
# Size must be set explicitly — foot defaults to monospace:size=8, far smaller
# than the 11 the alacritty package uses.
font=JetBrains Mono:size=11

# alacritty's [window.padding] x=8 y=8.
pad=8x8

# TERM=foot is correct locally, but remote hosts without foot's terminfo fall over
# (same failure mode as kitty's xterm-kitty). Uncomment to trade foot's extended
# capabilities for something every host already knows:
# term=xterm-256color

[csd]
# alacritty's `decorations = "None"`. Under sway a tiled window has no titlebar
# either way; this matters for the floating case.
preferred=none
