# tmux — managed by ~/repos/dotfiles (stow package: tmux)
#
# Lives at ~/.config/tmux/tmux.conf, not ~/.tmux.conf: the rendered palette
# (colors.gen.conf) and the status-bar helper script have to live beside it, and
# neither belongs in $HOME. tmux has read this path since 3.1.
#
# NO HEX VALUES IN THIS FILE. Every colour is a role from palettes.toml, reached
# through the `@thm_*` user options that colors.gen.conf defines; tests/check_hex.py
# fails the build on a literal one.

# enable 256-colour and true-colour (24-bit)
#
# MUST be tmux-256color, not screen-256color. tmux's tty_set_italics() refuses
# to emit real italics when default-terminal is `screen` or begins with
# `screen-`, and sends standout instead — which on foot is \e[7m, reverse
# video. Under that setting nvim's italic Comment rendered as its *foreground*
# — the `muted` role — painted across the line as a background. That entry is
# also missing Smulx (coloured underlines) and smxx (strikethrough), so LSP
# diagnostics would degrade next. `*256col*` still matches this value, so the
# Tc override below is unaffected.
set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-colour

# Remap

#unbind r
#bind r refresh-client -S

# Functionality
set -g set-clipboard on
set -g detach-on-destroy off
set -g escape-time 0 # remove delay from existing insert mode
set -g history-limit 1000000 #increase history from 2k
set -g mouse on
set -g status-interval 5 #update the status bar every 5 seconds
set -g allow-passthrough on # allow programs in the pane to bypass tmux

# ---------------------------------------------------------------------------
# Palette
#
# Sourced FIRST, so anything below could override it -- and nothing below does.
# It sets the style options that take a colour directly (status, message, mode,
# pane borders) plus the `@thm_*` roles the format strings below interpolate.
# ---------------------------------------------------------------------------
source ~/.config/tmux/colors.gen.conf

# ---------------------------------------------------------------------------
# Status bar
#
# Three groups. Most of what is in them is conditional, so the bar is quiet
# when there is nothing to say. In full:
#
# LEFT
#   always   session name, in `accent`, bold
#   always   a `│` divider, in `sel`
#   always   every window as `index:name` -- active window's index in `accent`
#            and bold with its name in `fg_bright`, all others flat `muted`
#   per window, only when true:
#     +        the window contains a zoomed pane      window_zoomed_flag
#     !        the window rang the bell               window_bell_flag
#   `<` and `>` appear at the ends of the list, and only when it is too wide
#   to fit; the window list is the part of the bar that gives way first.
#
# CENTRE
#   always   what the ACTIVE pane is, in `muted`, cut to 50 columns with a
#            trailing `…`. Whichever of these applies:
#     pane title      when one was deliberately set -- `select-pane -T <name>`,
#                     or an OSC 2 from the program in the pane
#     pane command    when the title is still the hostname, or is the
#                     `user@host:cwd` that PROMPT_COMMAND overwrites it with
#
# RIGHT
#   only when true:
#     PREFIX   the prefix key is being held         client_prefix       warning
#     <mode>   the pane is in copy or view mode     pane_in_mode        accent2
#     SYNC     synchronize-panes is on              pane_synchronized   critical
#     <branch> the pane's directory is inside a     scripts/git-branch  indicator
#              git worktree; `*` suffix if dirty
#   always   the basename of the active pane's directory, in `muted`
#
# Deliberately absent: clock, date, battery, CPU, memory. Waybar shows all five
# one row up, and a second copy is noise. What is here instead is the part
# waybar cannot know -- which tmux mode the keyboard is in, and where the
# focused pane is.
#
# EVERY dynamic value below goes through `qh`, which doubles `#` (`#{qh:...}`).
# This is not cosmetic. tmux expands the format first and parses `#[...]` style
# directives in the result second, so a `#` arriving from a pane title, a
# window name or a branch name is indistinguishable from the start of a
# directive -- and a value ENDING in `#` pairs with the `#` of the next real
# directive to make `##`, an escaped literal, which silently turns that
# directive into visible text. Observed: a Claude Code pane title ending in a
# truncated issue number ate `#[nolist align=right]`, printed it into the bar,
# and left the right-hand group unaligned. `qh` also blocks the other
# direction, a title containing `#[fg=red]` restyling the bar.
#
# The order matters and is not the order it is written in: `#{=/50/…;qh:x}`
# trims FIRST and escapes second. That way round is the only safe one -- escape
# first and the trim can fall between the two halves of a `##`, leaving the
# dangling `#` this is all meant to prevent. Chained modifiers also only accept
# a plain variable name, which is why the conditional wraps two fully-modified
# branches rather than one modifier wrapping a conditional.
# ---------------------------------------------------------------------------

set -g status-position top
set -g status-left-length 40
set -g status-right-length 80

# --- left: the session ---
# `#{qh:session_name}` rather than the `#S` shorthand: a session may be renamed
# to anything, `#S` does not escape, and see the note on `qh` above.
set -g status-left "#[fg=#{@thm_accent}]#[bold] #{qh:session_name} #[default]#[fg=#{@thm_sel}]│"

# --- left: the window list ---
# The index carries the colour and the name stays plain, so the number you type
# after the prefix is the part that stands out. Inactive windows sit at `muted`,
# which is dim enough to read as a list rather than as five competing labels.
# `#I` is a number and safe bare; the name is not, so it is not `#W`.
set -g window-status-format         "#[fg=#{@thm_muted}] #I:#{qh:window_name}#{?window_zoomed_flag,+,}#{?window_bell_flag,!,}"
set -g window-status-current-format "#[fg=#{@thm_accent}]#[bold] #I#[fg=#{@thm_fg_bright}]:#{qh:window_name}#{?window_zoomed_flag,+,}"

# --- centre: the active pane ---
# "The pane name" is `pane_title`, and left alone that is close to useless: it
# defaults to the hostname, and /etc/bash.bashrc's PROMPT_COMMAND overwrites it
# with `user@host:cwd` on every prompt -- so it reads as either the machine you
# are already on or the directory the right-hand side is already showing. Both
# of those are detected and fall back to the command the pane is running, which
# is the thing actually worth knowing about a pane you are not looking at.
#
# Set a real one with `select-pane -T <name>` (or an OSC 2 from the program) and
# it is shown verbatim. Programs that set long ones exist -- Claude Code writes
# the whole task description -- hence the 50-column cut.
#
# `=/50/…;qh` is applied to each branch rather than to the conditional, because
# chained modifiers take a variable name and not an expression. See above for
# why trimming has to happen before escaping.
set -g @thm_pane_name "#{?#{||:#{==:#{pane_title},#{host_short}},#{m:*@*:*,#{pane_title}}},#{=/50/…;qh:pane_current_command},#{=/50/…;qh:pane_title}}"

# --- right: state, branch, directory ---
# PREFIX and SYNC in particular are states with no other tell: a forgotten
# `synchronize-panes` types into every pane at once, and the only warning tmux
# gives by default is none.
#
# The branch is the one segment whose text this file does not control, so
# git-branch.sh escapes its own `#` before printing -- a branch called
# `fix/#123` would otherwise do to the segment after it exactly what the pane
# title did to the alignment.
set -g status-right "\
#{?client_prefix,#[fg=#{@thm_warning}]#[bold]PREFIX #[default],}\
#{?pane_in_mode,#[fg=#{@thm_accent2}]#[bold]#{pane_mode} #[default],}\
#{?pane_synchronized,#[fg=#{@thm_critical}]#[bold]SYNC #[default],}\
#[fg=#{@thm_indicator}]#(~/.config/tmux/scripts/git-branch.sh '#{pane_current_path}')\
#[fg=#{@thm_muted}]#{b;qh:pane_current_path} "

# --- assembling the three groups ---
# tmux gives the status line a left group, one group aligned by `status-justify`
# and a right group; there is no fourth slot, so a centred element means writing
# `status-format[0]` out by hand. This is the stock format with two changes: the
# window list is pinned into the LEFT group (after status-left) instead of being
# placed by `status-justify`, and an `align=centre` group holding the pane name
# is inserted before the right group.
#
# Consequences of taking the format over, both intentional:
#   * `status-justify` no longer does anything.
#   * the per-window activity/bell STYLE options no longer apply -- the stock
#     format's four nested conditionals for them are gone. The flags are shown
#     as characters in window-status-format instead, which is legible here in a
#     way that reconstructing that expression would not be.
# `range=window|#{window_index}` is what keeps click-to-select working, and
# `range=left`/`range=right` the mouse bindings on the two ends. Losing those
# silently is the usual cost of a hand-written status-format.
#
# The `list=on` ... `nolist` pair is load-bearing and looks like decoration.
# Without it the three `align=` groups are all still accepted, tmux reports no
# error, and the bar renders with every group flush left -- left, centre and
# right run together into one string. It is the list markers that tell tmux the
# window list is the elastic part of the line, and alignment is computed around
# it. `<` and `>` are the overflow markers for a list too long to fit.
set -g status-format[0] "\
#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]\
#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]\
#{W:\
#[range=window|#{window_index}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default],\
#[range=window|#{window_index} list=focus]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]\
}\
#[nolist align=centre]#[fg=#{@thm_muted}]#{=/60:#{E:@thm_pane_name}}\
#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Resurrect
# set -g @resurrect-capture-pane-contents "on"
